name: Release

# Neues Release: git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet test

  build:
    needs: test
    strategy:
      matrix:
        include:
          # macOS-Builds auf macOS, damit die Binaries (ad hoc) signiert sind – sonst startet Apple Silicon sie nicht
          - { os: macos-latest, rid: osx-arm64 }
          - { os: macos-latest, rid: osx-x64 }
          - { os: ubuntu-latest, rid: linux-x64 }
          - { os: ubuntu-latest, rid: linux-arm64 }
          - { os: windows-latest, rid: win-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Version aus dem Tag
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]] || v="0.0.0-dev"
          echo "VERSION=$v" >> "$GITHUB_ENV"

      - name: Publish
        shell: bash
        run: >
          dotnet publish src/Linksta -c Release -r ${{ matrix.rid }} --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none -p:PackAsTool=false -p:Version=${{ env.VERSION }}
          -o out

      - name: Packen
        shell: bash
        run: |
          cd out
          if [[ "${{ matrix.rid }}" == win-* ]]; then
            7z a "../linksta-${{ matrix.rid }}.zip" linksta.exe
          else
            chmod +x linksta
            tar -czf "../linksta-${{ matrix.rid }}.tar.gz" linksta
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: linksta-${{ matrix.rid }}
          path: linksta-${{ matrix.rid }}.*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Prüfsummen
        run: cd dist && sha256sum linksta-* > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
